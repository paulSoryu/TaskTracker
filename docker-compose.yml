services:
  backend-api:
    image: tasktracker-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/tasktracker.db
    volumes:
      - sqlite-data:/app/data
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys

  frontend-app:
    image: tasktracker-frontend
    build:
      context: ./TaskTracker.Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend-api

volumes:
  sqlite-data:
  dataprotection-keys: