services:
  backend-api:
    image: webapi-tasktracker-backend
    build:
      context: ./WebApiTaskTracker
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - sqlite-data:/app/3_DataAccess/Databases
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys

  frontend-app:
    image: webapi-tasktracker-frontend
    build:
      context: ./WebApiTaskTracker.Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend-api

volumes:
  sqlite-data:
  dataprotection-keys: